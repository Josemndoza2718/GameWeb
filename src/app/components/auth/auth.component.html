<div class="flex justify-content-center align-items-center min-h-screen p-3">
    <p-card [header]="isRegister() ? 'Crear Cuenta' : 'Iniciar Sesión'" [style]="{ width: '100%', maxWidth: '400px' }">
        <form (ngSubmit)="onSubmit()" class="flex flex-column gap-3">

            @if (errorMessage()) {
                <p-message severity="error">{{ errorMessage() }}</p-message>
            }

            @if (isRegister()) {
                <div class="flex flex-column gap-2">
                    <label for="username">Nombre de Usuario</label>
                    <input id="username" type="text" pInputText [(ngModel)]="username" name="username" required />
                </div>
            }

            <div class="flex flex-column gap-2">
                <label for="email">Correo Electrónico</label>
                <input id="email" type="email" pInputText [(ngModel)]="email" name="email" required />
            </div>

            <div class="flex flex-column gap-2">
                <label for="password">Contraseña</label>
                <p-password id="password" [(ngModel)]="password" name="password" [toggleMask]="true"
                    [feedback]="isRegister()" required></p-password>
            </div>

            <p-button [label]="isRegister() ? 'Registrarse' : 'Ingresar'" [loading]="loading()" type="submit"
                styleClass="w-full mt-2">
            </p-button>

            <div class="text-center mt-2">
                <small class="cursor-pointer text-primary" (click)="toggleMode()">
                    {{ isRegister() ? '¿Ya tienes cuenta? Inicia Sesión' : '¿No tienes cuenta? Regístrate aquí' }}
                </small>
            </div>
        </form>
    </p-card>
</div>
